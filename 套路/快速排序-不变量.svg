<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13">
  <!-- 顶部下标 -->
  <text x="60"  y="20" text-anchor="middle" font-size="11" fill="#666">left</text>
  <text x="195" y="20" text-anchor="middle" font-size="11" fill="#666">left+1 ... le−1</text>
  <text x="390" y="20" text-anchor="middle" font-size="11" fill="#666">le ... ge</text>
  <text x="590" y="20" text-anchor="middle" font-size="11" fill="#666">ge+1 ... right</text>
  <!-- 四个区块 -->
  <rect x="30"  y="35" width="60"  height="85" rx="8" fill="#ffe5e5" stroke="#c00" stroke-width="2"/>
  <rect x="100" y="35" width="190" height="85" rx="8" fill="#e8f5e8" stroke="#393" stroke-width="2"/>
  <rect x="300" y="35" width="180" height="85" rx="8" fill="#fff8dc" stroke="#c90" stroke-width="2"/>
  <rect x="490" y="35" width="200" height="85" rx="8" fill="#e8e8ff" stroke="#36c" stroke-width="2"/>
  <!-- pivot -->
  <text x="60"  y="68" text-anchor="middle" font-weight="bold" font-size="15" fill="#900">pivot</text>
  <text x="60"  y="90" text-anchor="middle" font-size="11" fill="#900">不动</text>
  <!-- 左已处理 -->
  <text x="195" y="63" text-anchor="middle" font-weight="bold" font-size="15" fill="#262">≤ pivot</text>
  <text x="195" y="83" text-anchor="middle" font-size="11" fill="#262">已处理（左）</text>
  <text x="195" y="105" text-anchor="middle" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">[left+1, le)</text>
  <!-- 中未处理 -->
  <text x="390" y="63" text-anchor="middle" font-weight="bold" font-size="15" fill="#960">未处理</text>
  <text x="390" y="83" text-anchor="middle" font-size="11" fill="#960">双闭，未看过</text>
  <text x="390" y="105" text-anchor="middle" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">[le, ge]</text>
  <!-- 右已处理 -->
  <text x="590" y="63" text-anchor="middle" font-weight="bold" font-size="15" fill="#239">≥ pivot</text>
  <text x="590" y="83" text-anchor="middle" font-size="11" fill="#239">已处理（右）</text>
  <text x="590" y="105" text-anchor="middle" font-size="12" fill="#444" font-family="ui-monospace, Menlo, monospace">(ge, right]</text>
  <!-- 底注 -->
  <text x="360" y="145" text-anchor="middle" font-size="12" fill="#555">任何迭代边界都满足此分布</text>
</svg>
